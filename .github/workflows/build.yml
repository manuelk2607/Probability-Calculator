name: Test and Package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / Java ${{ matrix.java }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ['17']
        include:
          - os: ubuntu-latest
            java: '25'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test and build (Linux with virtual desktop)
        if: runner.os == 'Linux'
        run: xvfb-run -a mvn --batch-mode --no-transfer-progress package -Dui.tests=true
      - name: Test and build (native desktop)
        if: runner.os != 'Linux'
        run: mvn --batch-mode --no-transfer-progress package "-Dui.tests=true"
      - name: Native installers and bundled-runtime smoke tests
        if: matrix.java == '17' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fakeroot
      - name: Package native installers
        if: matrix.java == '17'
        run: python scripts/package.py
      - name: Test reports and UI screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tests-${{ runner.os }}-java${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/ui-review/
      - name: Installers
        if: matrix.java == '17'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: installers-${{ runner.os }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check tag matches Maven version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c 'import os, xml.etree.ElementTree as E; v=E.parse("pom.xml").getroot().find("{http://maven.apache.org/POM/4.0.0}version").text; assert os.environ["RELEASE_TAG"] == "v" + v'
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Probability Calculator $RELEASE_TAG" --notes-file RELEASE_NOTES.md
